# Name: Version Lifecycle Manager
kind: AdaptiveDialog
modelDescription: Guides installing, activating, deactivating, deleting snapshots and syncing env vars.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Version Lifecycle Manager
    triggerQueries:
      - activate snapshot
      - deactivate version
      - sync env vars
      - version-lifecycle-manager
      - install process app
  actions:
    - kind: AnswerQuestionWithAI
      id: answerAI_67JtNlXs
      autoSend: true
      userInput: =System.Activity.Text
      additionalInstructions: |
        You are guiding version-lifecycle-manager. Explain lifecycle operations and env var sync conceptually; warn about destructive deletes.