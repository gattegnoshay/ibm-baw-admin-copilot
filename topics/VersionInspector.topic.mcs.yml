# Name: Version Inspector
kind: AdaptiveDialog
modelDescription: Guides browsing containers and inspecting snapshot metadata.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Version Inspector
    triggerQueries:
      - inspect snapshot
      - list process apps
      - version-inspector
      - what's deployed
  actions:
    - kind: AnswerQuestionWithAI
      id: answerAI_ONQ5cu8F
      autoSend: true
      userInput: =System.Activity.Text
      additionalInstructions: |
        You are guiding version-inspector. Explain snapshot metadata fields and container browse/list patterns. Read-only guidance.